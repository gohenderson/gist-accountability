# The iPhone app's Xcode project, generated by XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   brew install xcodegen && cd ios && xcodegen generate && open Gist.xcodeproj
# The generated Gist.xcodeproj isn't committed; this file is the source of truth.
name: Gist
options:
  bundleIdPrefix: dev.gist
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  GistCore:
    path: GistCore
targets:
  Gist:
    type: application
    platform: iOS
    sources:
      - path: Gist
    dependencies:
      - package: GistCore
    info:
      path: Gist/Info.plist
      properties:
        CFBundleDisplayName: Gist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAlarmKitUsageDescription: Gist rings your check-ins as alarms, even in Silent mode or a Focus.
        NSCameraUsageDescription: Gist uses the camera to scan the code for a check-in's scan step.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad: every orientation (needed for split view and Stage Manager).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gist.checkin
        PRODUCT_NAME: Gist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    scheme:
      gatherCoverageData: false
