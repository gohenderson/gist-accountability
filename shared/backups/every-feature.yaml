# Gist backup. Import it with Settings → Import backup… (you choose what to bring in).
# A sample with one of everything, shared by the Android and iOS test suites.
format: gist-backup
version: 3
exportedAt: 2026-11-10T12:00:00Z
checkins:
# A strict wake-up: different times on different days, a monthly-only time, a place
# condition, every kind of step, and a caption.
- id: wake01
  name: Wake up
  times:
  - t: '04:00'
    days:
      kind: weekly
      days: [2]
  - t: '04:45'
    days:
      kind: weekly
      days: [1, 3, 4, 5, 6, 7]
  - t: '09:00'
    days:
      kind: monthly
      days: [1, 15, -1]   # -1: the last day of the month
    where: at
    place:
      name: Home
      lat: 40.7128
      lon: -74.006
      radiusM: 200
  repeat:
    kind: daily
    days: []
  enabled: true
  aboutYesterday: false
  soundUri: ''
  soundTitle: ''
  background:
    kind: none
    intervalSec: 10
    caption: Future you says thanks
  steps:
  - id: m1
    kind: math
    mathCount: 10
    mathLevel: 4
  - id: s1
    kind: scan
    scanCode: GIST-SINK-0001
    scanLabel: Bathroom sink
  - id: q1
    kind: questions
    questions:
    - id: soda
      text: Did you have a soda yesterday?
      yesIsGood: false
    - id: water
      text: Did you drink water?
      yesIsGood: true
  events: []
  category: Morning routine
  commitment: strict
  voiceSource: text
  voiceText: ''
  voiceHeadphonesOnly: true
  snoozeMinutes: 10
# A soft nudge, set off by arriving at a place, only between two times.
- id: gym01
  name: Stretch at the gym
  times: []
  repeat:
    kind: daily
    days: []
  enabled: true
  aboutYesterday: false
  soundUri: ''
  soundTitle: ''
  background:
    kind: none
    intervalSec: 10
    caption: ''
  steps:
  - id: q2
    kind: questions
    questions:
    - id: stretch
      text: Did you stretch first?
      yesIsGood: true
  events:
  - kind: arrive
    where: anywhere
    oncePerDay: true
    minRunMinutes: 0
    days:
      kind: weekly
      days: [1, 3, 5]
    place:
      name: Gym
      lat: 40.75
      lon: -73.99
      radiusM: 300
    windowStart: '05:00'
    windowEnd: '10:00'
  category: Fitness
  commitment: soft
  voiceSource: text
  voiceText: ''
  voiceHeadphonesOnly: true
  snoozeMinutes: 15
# A voice line 60 minutes into a run, every run.
- id: run01
  name: Forrest Gump
  times: []
  repeat:
    kind: daily
    days: []
  enabled: false
  aboutYesterday: false
  soundUri: ''
  soundTitle: ''
  background:
    kind: none
    intervalSec: 10
    caption: ''
  steps: []
  events:
  - kind: run-for
    where: anywhere
    oncePerDay: false
    minRunMinutes: 60
    days:
      kind: daily
      days: []
  category: Fitness
  commitment: voice
  voiceSource: text
  voiceText: Is that Forrest Gump?
  voiceHeadphonesOnly: false
  snoozeMinutes: 10
entries:
  2026-11-08:
    wake01:
      '04:45':
        s: answered
        a:
          soda: false
          water: true
        early: false
    gym01:
      '07:12':
        s: dismissed
        a: {}
        early: false
        soft: true
  2026-11-09:
    wake01:
      '04:45':
        s: rang
        a: {}
        early: false
  2026-11-10:
    wake01:
      '04:00':
        s: skipped
        a: {}
        early: false
media: {}
