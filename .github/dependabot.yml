# Dependabot opens a pull request when a library or GitHub Action has a newer version or a
# security fix. Each PR runs the full Build workflow (all tests) before you merge it.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
      day: monday
    groups:
      android-test:
        patterns: ["androidx.test*"]
      kotlin-and-agp:
        patterns: ["org.jetbrains.kotlin*", "com.android.*"]
    ignore:
      # 3.x targets Java 11 library APIs missing on Android 10–12; 2.x still gets fixes.
      - dependency-name: "org.snakeyaml:snakeyaml-engine"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
