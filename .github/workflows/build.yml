name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.14.3"

jobs:
  build:
    name: Debug build + lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Environment info
        run: |
          set -x
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || echo "::warning::Android SDK listing failed"

      - name: Build debug APK
        run: bash .github/scripts/run-gradle.sh assembleDebug

      - name: Lint (report only)
        run: bash .github/scripts/run-gradle.sh lintDebug

      - name: Show lint findings
        if: always()
        run: |
          report=app/build/reports/lint-results-debug.txt
          if [[ ! -f "$report" ]]; then echo "No lint text report."; exit 0; fi
          cat "$report"
          {
            echo "### Lint"
            echo '```'
            grep -E ': (Error|Warning): ' "$report" | sed -E 's/.*: (Error|Warning): .* \[([A-Za-z0-9]+)\]$/\1 \2/' | sort | uniq -c | sort -rn || true
            tail -n 1 "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: gist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            build-logs/
            app/build/reports/
            build/reports/
            app/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report failure
        if: failure()
        run: |
          {
            echo "### Build failed"
            echo
            echo "Failed run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "If the failure was in a Gradle step, the error details are above."
            echo "Otherwise, open the failed step's log on the run page."
            echo "Logs and reports: the **build-logs** artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Build failed::See the job summary and the build-logs artifact."
