name: Build

# The Android app: build, unit tests, lint, and UI tests on an emulator.
# A first "changes" job checks whether anything Android-related changed (android/, shared/,
# .github/); if not (say, a docs-only or iOS-only PR), the jobs report as skipped, which
# still satisfies required checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # the Release workflow runs this first and only releases if it passes

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Android changes?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.check.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check changed files
        id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Pushes to main, manual runs and releases (workflow_call) always build.
          if [[ "$EVENT" == "pull_request" ]]; then
            files="$(git diff --name-only "$BASE"...HEAD)"
          elif [[ "$EVENT" == "push" && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] \
              && git cat-file -e "$BEFORE" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" HEAD)"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"; echo "Always built for $EVENT."; exit 0
          fi
          echo "$files"
          if grep -qE '^(android/|shared/|\.github/)' <<< "$files"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "### Nothing Android-related changed: build and tests skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The Easy Connect experiment: Syncthing's program built for Android (debug builds only),
  # cached per Syncthing version and passed to the jobs below.
  syncthing:
    name: Syncthing for Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Syncthing version
        id: v
        run: echo "version=$(tr -d '[:space:]' < android/syncthing.version)" >> "$GITHUB_OUTPUT"

      - name: Cached build
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: android/syncthing/jniLibs
          key: syncthing-${{ steps.v.outputs.version }}-${{ hashFiles('.github/scripts/build-syncthing.sh') }}

      - name: Syncthing's source
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: git clone -q --depth 1 --branch "$VERSION" https://github.com/syncthing/syncthing _syncthing-src

      - name: Set up Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: _syncthing-src/go.mod
          cache: false

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-syncthing.sh _syncthing-src android/syncthing/jniLibs arm64-v8a x86_64

      - name: Sizes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          {
            echo "### Syncthing $VERSION for Android"
            echo '```'
            ls -l android/syncthing/jniLibs/*/libsyncthing.so | awk '{printf "%-50s %6.1f MB\n", $9, $5/1048576}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: syncthing-native
          path: android/syncthing/jniLibs
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build, unit tests, lint
    needs: [changes, syncthing]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle version (from the wrapper)
        run: |
          v=$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-bin\.zip$/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$v" ]; then echo "::error::No Gradle version in gradle-wrapper.properties"; exit 1; fi
          echo "GRADLE_VERSION=$v" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic   # MIT-licensed caching on actions/cache (free for any repo)
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Syncthing (debug builds)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syncthing-native
          path: android/syncthing/jniLibs

      - name: Environment info
        run: |
          set -x
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || echo "::warning::Android SDK listing failed"

      - name: Build debug APK
        run: bash .github/scripts/run-gradle.sh assembleDebug

      - name: Syncthing is in the debug APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libsyncthing.so" || { echo "::error title=Syncthing::Not in the debug APK for $abi"; exit 1; }
          done
          echo "Debug APK (with Syncthing for arm64-v8a and x86_64): $(du -m "$apk" | cut -f1) MB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Library API levels
        # Libraries are built for a Java version, not an Android one: check they don't call
        # Java APIs the app's oldest Android lacks (lint doesn't look inside them).
        run: |
          min="$(grep -oP 'minSdk\s*=\s*\K\d+' android/app/build.gradle.kts)"
          python3 .github/scripts/check-library-apis.py android/app/build/outputs/apk/debug/app-debug.apk "$min"

      - name: Unit tests
        run: bash .github/scripts/run-gradle.sh testDebugUnitTest

      - name: Unit test summary
        if: always()
        run: python3 .github/scripts/test-summary.py "Unit tests" android/app/build/test-results

      - name: Lint (report only)
        run: bash .github/scripts/run-gradle.sh lintDebug

      - name: Show lint findings
        if: always()
        run: |
          report=android/app/build/reports/lint-results-debug.txt
          if [[ ! -f "$report" ]]; then echo "No lint text report."; exit 0; fi
          cat "$report"
          {
            echo "### Lint"
            echo '```'
            grep -E ': (Error|Warning): ' "$report" | sed -E 's/.*: (Error|Warning): .* \[([A-Za-z0-9]+)\]$/\1 \2/' | sort | uniq -c | sort -rn || true
            tail -n 1 "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK

        continue-on-error: true   # a storage hiccup shouldn't fail the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gist-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs and reports

        continue-on-error: true   # a storage hiccup shouldn't fail the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-logs
          path: |
            build-logs/
            android/app/build/reports/
            android/app/build/test-results/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report failure
        if: failure()
        run: |
          {
            echo "### Build failed"
            echo
            echo "Failed run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Compile errors and failing tests are annotated above and on the code."
            echo "Logs and reports: the **build-logs** artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Build failed::See the job summary and the build-logs artifact."

  ui-tests:
    name: UI tests (emulator)
    needs: [changes, syncthing]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle version (from the wrapper)
        run: |
          v=$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-bin\.zip$/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$v" ]; then echo "::error::No Gradle version in gradle-wrapper.properties"; exit 1; fi
          echo "GRADLE_VERSION=$v" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic   # MIT-licensed caching on actions/cache (free for any repo)
          cache-read-only: true   # the build job saves the cache; avoid both saving at once
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Syncthing (debug builds)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syncthing-native
          path: android/syncthing/jniLibs

      - name: Build app and test APKs
        run: bash .github/scripts/run-gradle.sh assembleDebug assembleDebugAndroidTest

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          # One command only: the action runs each script line as a separate shell.
          script: bash .github/scripts/ui-tests.sh

      - name: UI test summary
        if: always()
        run: python3 .github/scripts/test-summary.py "UI tests" android/app/build/outputs/androidTest-results

      - name: Upload logs, reports and failure screenshots

        continue-on-error: true   # a storage hiccup shouldn't fail the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-test-logs
          path: |
            build-logs/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report failure
        if: failure()
        run: |
          {
            echo "### UI tests failed"
            echo
            echo "Failing tests are listed above. The **ui-test-logs** artifact has the HTML report,"
            echo "a screenshot of each failed test's screen, and the emulator's full log."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=UI tests failed::See the job summary and the ui-test-logs artifact."
