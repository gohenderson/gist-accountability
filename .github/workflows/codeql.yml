name: CodeQL

# GitHub's free code scanner: looks for security bugs in the Kotlin code and in these
# workflow files. Findings show under Security → Code scanning, and the weekly Security
# report emails a summary (as an issue assigned to the repo owner).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle version (from the wrapper)
        if: matrix.language == 'java-kotlin'
        run: |
          v=$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-bin\.zip$/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$v" ]; then echo "::error::No Gradle version in gradle-wrapper.properties"; exit 1; fi
          echo "GRADLE_VERSION=$v" >> "$GITHUB_ENV"

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic   # MIT-licensed caching on actions/cache (free for any repo)
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build (so CodeQL can see the Kotlin compiler's view of the code)
        if: matrix.build-mode == 'manual'
        run: gradle -p android assembleDebug --no-build-cache --rerun-tasks --console=plain

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
