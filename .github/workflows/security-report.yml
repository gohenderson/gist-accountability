name: Security report

# Weekly check for outdated libraries / build tools / GitHub Actions (incl. old Node.js
# runtimes), known vulnerabilities in every resolved dependency (OSV database), and open
# CodeQL alerts. If anything is found, it opens (or updates) one issue assigned to the
# repo owner, and GitHub emails them. When everything is clear again, the issue is closed.

on:
  schedule:
    - cron: "43 13 * * 1"   # Mondays 13:43 UTC (after CodeQL)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: read

env:
  GRADLE_VERSION: "8.14.3"

jobs:
  report:
    name: Dependency & security report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: List every resolved dependency
        run: |
          mkdir -p build-logs
          for conf in releaseRuntimeClasspath debugAndroidTestRuntimeClasspath debugUnitTestRuntimeClasspath; do
            gradle -q :app:dependencies --configuration "$conf" > "build-logs/deps-$conf.txt" \
              || echo "::warning title=Couldn't list $conf::see build-logs/deps-$conf.txt"
          done
          gradle -q buildEnvironment > build-logs/deps-buildscript.txt || true
          wc -l build-logs/deps-*.txt

      - name: Build the report
        id: report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/deps-report.py --out report.md \
            --deps build-logs/deps-releaseRuntimeClasspath.txt \
            --deps build-logs/deps-debugAndroidTestRuntimeClasspath.txt \
            --deps build-logs/deps-debugUnitTestRuntimeClasspath.txt \
            --deps build-logs/deps-buildscript.txt

      - name: Open, update or close the report issue
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.report.outputs.findings }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh label create security-report --color B60205 --description "Weekly dependency & security report" 2>/dev/null || true
          issue="$(gh issue list --label security-report --state open --json number -q '.[0].number')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${FINDINGS:-0}" -gt 0 ]]; then
            printf '\n---\nGenerated by the [Security report workflow](%s).\n' "$run_url" >> report.md
            if [[ -n "$issue" ]]; then
              gh issue edit "$issue" --body-file report.md
              gh issue comment "$issue" --body "Still ${FINDINGS} finding(s) as of $(date -u +%F). Details in the issue description. [Run](${run_url})"
            else
              gh issue create --title "Dependency & security report: ${FINDINGS} finding(s)" \
                --body-file report.md --label security-report --assignee "$OWNER"
            fi
            echo "::warning title=Security report::${FINDINGS} finding(s); see the report issue."
          elif [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "All clear as of $(date -u +%F). [Run](${run_url})"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: |
            report.md
            build-logs/
          if-no-files-found: ignore
