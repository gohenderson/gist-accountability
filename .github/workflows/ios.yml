name: iOS

# The iPhone app (ios/):
#  - GistCore, the app's logic as a Swift package: `swift test` (including importing the
#    sample backups in shared/backups that the Android tests import too);
#  - the app: its Xcode project is generated from ios/project.yml (XcodeGen), built for the
#    simulator (no signing), then launched on a simulator for screenshots;
#  - the app's UI tests (ios/GistUITests), on a simulator.
# Runs only when ios/ or shared/ (or this file) changes.

on:
  push:
    branches: [main]
    paths: ["ios/**", "shared/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "shared/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: GistCore (swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test
        working-directory: ios/GistCore
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/swift-test.log"

      - name: Summary
        if: always()
        run: |
          log=build-logs/swift-test.log
          [[ -f "$log" ]] || exit 0
          {
            echo "### GistCore tests"
            echo '```'
            grep -E "Executed [0-9]+ tests|error:|failed \(" "$log" | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Compile errors and failed assertions as annotations on the code.
          grep -E "^/.*:[0-9]+:[0-9]+: error: " "$log" | head -n 50 | while IFS= read -r line; do
            file="${line%%:*}"; rest="${line#*:}"; ln="${rest%%:*}"; rest="${rest#*:}"; col="${rest%%:*}"; msg="${rest#*: error: }"
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=$ln,col=$col::$msg"
          done || true

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14

  app:
    name: App (simulator build)
    runs-on: macos-26
    permissions:
      contents: write   # publishes the screenshots to the ios-screenshots branch
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          xcodebuild -project Gist.xcodeproj -scheme Gist -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/xcodebuild.log" \
            | grep -E "error:|warning: .*/ios/Gist/|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$GITHUB_WORKSPACE/build-logs/xcodebuild.log"

      - name: Annotate compile errors
        if: failure()
        run: |
          log=build-logs/xcodebuild.log
          [[ -f "$log" ]] || exit 0
          grep -E "^/.*:[0-9]+:[0-9]+: error: " "$log" | sort -u | head -n 60 | while IFS= read -r line; do
            file="${line%%:*}"; rest="${line#*:}"; ln="${rest%%:*}"; rest="${rest#*:}"; col="${rest%%:*}"; msg="${rest#*: error: }"
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=$ln,col=$col::$msg"
          done
          { echo "### App build failed"; echo '```'; grep -E "error:" "$log" | sort -u | head -n 60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Gist.ipa for iPhones and iPads (unsigned)
        working-directory: ios
        run: |
          # A Release build for real devices, without signing. Sideload it with your own Apple
          # ID (AltServer or Sideloadly sign it as they install it): see BUILDING.md.
          set -o pipefail
          xcodebuild -project Gist.xcodeproj -scheme Gist -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/xcodebuild-device.log" | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$GITHUB_WORKSPACE/build-logs/xcodebuild-device.log"
          app=build-device/Build/Products/Release-iphoneos/Gist.app
          mkdir -p ipa/Payload "$GITHUB_WORKSPACE/dist"
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry "$GITHUB_WORKSPACE/dist/Gist.ipa" Payload)
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")"
          size="$(du -h "$GITHUB_WORKSPACE/dist/Gist.ipa" | cut -f1)"
          {
            echo "### 📦 Gist.ipa ($version, $size, unsigned)"
            echo "Download the **Gist-ipa** artifact below, then sideload it with AltServer or Sideloadly (see BUILDING.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gist.ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Gist-ipa
          path: dist/Gist.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Screenshot on a simulator
        continue-on-error: true
        working-directory: ios
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          ios = sorted((k for k in d if 'iOS' in k), reverse=True)
          print(next(x['udid'] for k in ios for x in d[k] if x['name'].startswith('iPhone')))")"
          echo "Simulator: $udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/Gist.app
          mkdir -p "$GITHUB_WORKSPACE/screenshots"
          # Each screen, opened by a debug-only launch argument, with demo data.
          shot() {
            local name="$1"; shift
            xcrun simctl terminate "$udid" dev.gist.checkin 2>/dev/null || true
            xcrun simctl launch "$udid" dev.gist.checkin -gist-demo "$@"
            sleep 6
            xcrun simctl io "$udid" screenshot "$GITHUB_WORKSPACE/screenshots/$name.png"
          }
          xcrun simctl ui "$udid" appearance light
          shot 01-start
          shot 02-checkin -gist-route edit:wake
          shot 03-run -gist-route run:evening
          shot 04-history -gist-route history:evening
          shot 05-settings -gist-route settings
          shot 09-library -gist-route library
          xcrun simctl ui "$udid" appearance dark
          shot 06-start-dark
          # And on an iPad.
          ipad="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          ios = sorted((k for k in d if 'iOS' in k), reverse=True)
          print(next((x['udid'] for k in ios for x in d[k] if x['name'].startswith('iPad')), ''))")"
          if [[ -n "$ipad" ]]; then
            xcrun simctl shutdown "$udid" || true
            udid="$ipad"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/Gist.app
            xcrun simctl ui "$udid" appearance light
            shot 07-ipad-start
            shot 08-ipad-run -gist-route run:evening
          fi
          echo "### 📱 $(ls "$GITHUB_WORKSPACE/screenshots" | wc -l | tr -d ' ') screenshots (ios-screenshots artifact, and the ios-screenshots branch)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish screenshots to the ios-screenshots branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(screenshots/*.png)
          (( ${#files[@]} )) || { echo "No screenshots."; exit 0; }
          tmp="$(mktemp -d)"
          cp "${files[@]}" "$tmp/"
          cd "$tmp"
          printf '# iPhone screenshots\n\nFrom %s @ %s\n' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" > README.md
          git init -q -b ios-screenshots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "iPhone screenshots: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-screenshots

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-app-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14

  ui:
    name: App UI tests (simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run the UI tests
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          udid="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          ios = sorted((k for k in d if 'iOS' in k), reverse=True)
          print(next(x['udid'] for k in ios for x in d[k] if x['name'].startswith('iPhone')))")"
          echo "Simulator: $udid"
          xcodebuild -project Gist.xcodeproj -scheme Gist -configuration Debug \
            -destination "id=$udid" -derivedDataPath build -resultBundlePath "$GITHUB_WORKSPACE/build-logs/ui-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/ui-tests.log" \
            | grep -E "error:|Test Case .* (passed|failed)|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$GITHUB_WORKSPACE/build-logs/ui-tests.log"

      - name: Summary
        if: always()
        run: |
          log=build-logs/ui-tests.log
          [[ -f "$log" ]] || exit 0
          {
            echo "### App UI tests"
            echo '```'
            grep -E "Test Case .* (passed|failed)|error:|\*\* TEST" "$log" | sed -E 's/^.*Test Case //' | sort -u | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^/.*:[0-9]+: error: " "$log" | sort -u | head -n 40 | while IFS= read -r line; do
            file="${line%%:*}"; rest="${line#*:}"; ln="${rest%%:*}"; msg="${rest#*: error: }"
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=$ln::$msg"
          done || true

      - name: Upload the test results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-ui-test-results
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14
